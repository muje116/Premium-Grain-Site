description = "Default website layout"
==
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ this.page.meta_description|default('Premium Grains and SAFFEI connect production, farmer support and reliable markets across Malawi.') }}">
  <title>{{ this.page.title }} | Premium Grains x SAFFEI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ 'assets/css/site.css'|theme }}" rel="stylesheet">
  {% styles %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% partial 'site/header' %}
  <main id="main">{% page %}</main>
  {% partial 'site/footer' %}
  <script src="{{ 'assets/js/site.js'|theme }}"></script>
  {% framework extras %}{% scripts %}
</body>
</html>
