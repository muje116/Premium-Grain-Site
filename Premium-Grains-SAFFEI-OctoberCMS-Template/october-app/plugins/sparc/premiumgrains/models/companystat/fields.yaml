fields:
    slug:
        label: Stable key
        comment: Lowercase identifier used when a page needs a specific fact.
        span: left
    value:
        label: Value
        comment: The large figure or phrase shown on the site, for example 480+.
        span: right
    label:
        label: Label
        span: right
    context:
        label: Context
        type: textarea
        size: small
    sort_order:
        label: Sort order
        type: number
        default: 1
        span: left
    is_active:
        label: Published
        type: switch
        default: true
        span: right
