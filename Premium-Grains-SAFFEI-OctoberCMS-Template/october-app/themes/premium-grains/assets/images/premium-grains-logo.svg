<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3B559"/>
      <stop offset="100%" stop-color="#C0912F"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6B44"/>
      <stop offset="100%" stop-color="#1B4630"/>
    </linearGradient>
  </defs>

  <!-- Background: transparent -->

  <!-- Emblem group -->
  <g transform="translate(450,190)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#greenGrad)" stroke-width="8"/>
    <circle cx="0" cy="0" r="123" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Rising sun / field arcs at base -->
    <g stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M -95 78 A 100 100 0 0 1 95 78"/>
      <path d="M -70 100 A 128 128 0 0 1 70 100" stroke-width="4" opacity="0.55"/>
    </g>

    <!-- Grain stalks: 3-stalk motif, center tallest -->
    <!-- helper: a single grain ear built from paired kernel leaves along a stem -->

    <!-- LEFT stalk -->
    <g transform="translate(-46,10) rotate(-16)">
      <path d="M 0 92 Q -4 20 0 -78" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round"/>
      <g fill="url(#goldGrad)">
        <ellipse cx="-12" cy="-64" rx="11" ry="20" transform="rotate(-28 -12 -64)"/>
        <ellipse cx="12" cy="-64" rx="11" ry="20" transform="rotate(28 12 -64)"/>
        <ellipse cx="-13" cy="-38" rx="11" ry="20" transform="rotate(-28 -13 -38)"/>
        <ellipse cx="13" cy="-38" rx="11" ry="20" transform="rotate(28 13 -38)"/>
        <ellipse cx="-13" cy="-12" rx="11" ry="20" transform="rotate(-28 -13 -12)"/>
        <ellipse cx="13" cy="-12" rx="11" ry="20" transform="rotate(28 13 -12)"/>
        <ellipse cx="0" cy="-92" rx="9" ry="17"/>
      </g>
    </g>

    <!-- RIGHT stalk (mirror of left) -->
    <g transform="translate(46,10) rotate(16)">
      <path d="M 0 92 Q 4 20 0 -78" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round"/>
      <g fill="url(#goldGrad)">
        <ellipse cx="-12" cy="-64" rx="11" ry="20" transform="rotate(-28 -12 -64)"/>
        <ellipse cx="12" cy="-64" rx="11" ry="20" transform="rotate(28 12 -64)"/>
        <ellipse cx="-13" cy="-38" rx="11" ry="20" transform="rotate(-28 -13 -38)"/>
        <ellipse cx="13" cy="-38" rx="11" ry="20" transform="rotate(28 13 -38)"/>
        <ellipse cx="-13" cy="-12" rx="11" ry="20" transform="rotate(-28 -13 -12)"/>
        <ellipse cx="13" cy="-12" rx="11" ry="20" transform="rotate(28 13 -12)"/>
        <ellipse cx="0" cy="-92" rx="9" ry="17"/>
      </g>
    </g>

    <!-- CENTER stalk, tallest -->
    <g transform="translate(0,18)">
      <path d="M 0 88 L 0 -96" fill="none" stroke="url(#greenGrad)" stroke-width="7" stroke-linecap="round"/>
      <g fill="url(#goldGrad)">
        <ellipse cx="-13" cy="-74" rx="12" ry="22" transform="rotate(-26 -13 -74)"/>
        <ellipse cx="13" cy="-74" rx="12" ry="22" transform="rotate(26 13 -74)"/>
        <ellipse cx="-14" cy="-46" rx="12" ry="22" transform="rotate(-26 -14 -46)"/>
        <ellipse cx="14" cy="-46" rx="12" ry="22" transform="rotate(26 14 -46)"/>
        <ellipse cx="-14" cy="-18" rx="12" ry="22" transform="rotate(-26 -14 -18)"/>
        <ellipse cx="14" cy="-18" rx="12" ry="22" transform="rotate(26 14 -18)"/>
        <ellipse cx="0" cy="-105" rx="10" ry="19"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(450,378)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="0" font-size="54" font-weight="700" letter-spacing="4" fill="#1B4630">PREMIUM GRAINS</text>
    <text x="0" y="42" font-size="28" font-weight="400" letter-spacing="12" fill="#C0912F">LIMITED</text>
  </g>

  <!-- Divider -->
  <line x1="330" y1="436" x2="570" y2="436" stroke="#C0912F" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="450" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="3.5" fill="#4B4B4B">GROW &#183; EARN &#183; THRIVE</text>
</svg>
